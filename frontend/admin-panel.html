<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - SkillSwap</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .admin-grid {
      display: grid;
      grid-template-columns: 1fr 3fr;
      gap: 32px;
      margin-bottom: 48px;
    }
    @media (max-width: 992px) {
      .admin-grid {
        grid-template-columns: 1fr;
      }
    }
    .admin-menu {
      height: fit-content;
      position: sticky;
      top: 94px;
    }
    .admin-menu-item {
      padding: 12px 16px;
      border-radius: var(--border-radius);
      cursor: pointer;
      font-weight: 500;
      transition: var(--transition);
      color: var(--secondary);
    }
    .admin-menu-item:hover, .admin-menu-item.active {
      background-color: rgba(37, 99, 235, 0.08);
      color: var(--primary-blue);
    }
    .admin-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      margin-top: 16px;
    }
    .admin-table th, .admin-table td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      text-align: left;
    }
    .admin-table th {
      background-color: var(--background);
      color: var(--secondary);
      font-weight: 600;
    }
    .status-badge {
      padding: 2px 8px;
      border-radius: 50px;
      font-size: 11px;
      font-weight: 600;
    }
    .status-upcoming { background-color: rgba(37, 99, 235, 0.1); color: var(--primary-blue); }
    .status-completed { background-color: rgba(16, 185, 129, 0.1); color: var(--emerald); }
    .status-cancelled { background-color: rgba(239, 68, 68, 0.1); color: var(--red); }
  </style>
</head>
<body>

  <!-- Injected Header -->
  <div id="global-navbar"></div>

  <div class="page-header">
    <div class="container">
      <h1 class="page-title">Admin Management Panel</h1>
    </div>
  </div>

  <div class="container" id="admin-panel-container">
    <div class="admin-grid">
      <!-- Admin Navigation -->
      <div class="card admin-menu">
        <h3 style="font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 16px; padding-left: 12px;">Management</h3>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <div class="admin-menu-item active" onclick="switchAdminTab('overview', this)">📊 System Statistics</div>
          <div class="admin-menu-item" onclick="switchAdminTab('users', this)">👥 Manage Users</div>
          <div class="admin-menu-item" onclick="switchAdminTab('skills', this)">💻 Skill Listings</div>
          <div class="admin-menu-item" onclick="switchAdminTab('bookings', this)">📅 Booking Logs</div>
        </div>
      </div>

      <!-- Admin View Container -->
      <div id="admin-content-box">
        <!-- Dynamic view panel -->
      </div>
    </div>
  </div>

  <!-- Injected Footer -->
  <div id="global-footer"></div>

  <script src="/js/main.js"></script>
  <script>
    let activeAdminTab = 'overview';

    // Verify user role
    function verifyAdminAccess() {
      const userStr = localStorage.getItem('user');
      if (!userStr) {
        window.location.href = '/login.html';
        return false;
      }
      const user = JSON.parse(userStr);
      if (user.role !== 'admin') {
        window.location.href = '/dashboard.html';
        return false;
      }
      return true;
    }

    // Switch admin tabs
    function switchAdminTab(tabName, element) {
      activeAdminTab = tabName;
      
      const items = document.querySelectorAll('.admin-menu-item');
      items.forEach(it => it.classList.remove('active'));
      element.classList.add('active');

      loadAdminData();
    }

    // Load admin panel data
    async function loadAdminData() {
      if (!verifyAdminAccess()) return;
      showLoader('admin-content-box');

      try {
        if (activeAdminTab === 'overview') {
          const res = await apiFetch('/api/admin/stats');
          if (res.success) {
            const stats = res.data;
            
            // Format Category list
            let categoryHTML = '';
            stats.categoryDistribution.forEach(cat => {
              categoryHTML += `
                <div class="flex-between" style="padding: 10px 0; border-bottom: 1px dashed var(--border);">
                  <span style="font-weight: 500;">${cat._id}</span>
                  <span style="font-weight: 700; color: var(--primary-blue);">${cat.count} listings</span>
                </div>
              `;
            });

            document.getElementById('admin-content-box').innerHTML = `
              <div class="card" style="margin-bottom: 32px;">
                <h3 style="font-size: 18px; font-weight: 700; margin-bottom: 24px;">System Overview</h3>
                
                <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 32px;">
                  <div class="card" style="background-color: var(--background); padding: 16px; text-align: center;">
                    <strong style="font-size: 24px; color: var(--primary-blue);">${stats.users}</strong>
                    <p style="font-size: 12px; color: var(--secondary); margin-top: 4px;">Registered Users</p>
                  </div>
                  <div class="card" style="background-color: var(--background); padding: 16px; text-align: center;">
                    <strong style="font-size: 24px; color: var(--emerald);">${stats.skills}</strong>
                    <p style="font-size: 12px; color: var(--secondary); margin-top: 4px;">Active Skills</p>
                  </div>
                  <div class="card" style="background-color: var(--background); padding: 16px; text-align: center;">
                    <strong style="font-size: 24px; color: var(--yellow);">${stats.bookings.total}</strong>
                    <p style="font-size: 12px; color: var(--secondary); margin-top: 4px;">Total Bookings</p>
                  </div>
                  <div class="card" style="background-color: var(--background); padding: 16px; text-align: center;">
                    <strong style="font-size: 24px; color: var(--dark-blue);">${stats.creditsCirculating}</strong>
                    <p style="font-size: 12px; color: var(--secondary); margin-top: 4px;">Credits Circulating</p>
                  </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 32px;">
                  <div>
                    <h4 style="font-size: 15px; font-weight: 700; margin-bottom: 16px;">Sessions Breakdown</h4>
                    <div class="flex-between" style="padding: 10px 0; border-bottom: 1px dashed var(--border);">
                      <span>Upcoming (Booked)</span>
                      <strong style="color: var(--primary-blue);">${stats.bookings.upcoming}</strong>
                    </div>
                    <div class="flex-between" style="padding: 10px 0; border-bottom: 1px dashed var(--border);">
                      <span>Completed (Exchanged)</span>
                      <strong style="color: var(--emerald);">${stats.bookings.completed}</strong>
                    </div>
                    <div class="flex-between" style="padding: 10px 0; border-bottom: none;">
                      <span>Cancelled (Refunded)</span>
                      <strong style="color: var(--red);">${stats.bookings.cancelled}</strong>
                    </div>
                  </div>

                  <div>
                    <h4 style="font-size: 15px; font-weight: 700; margin-bottom: 16px;">Category Distribution</h4>
                    ${categoryHTML || '<p style="color: var(--secondary); font-size: 13px;">No category stats recorded.</p>'}
                  </div>
                </div>
              </div>
            `;
          }
        } 
        else if (activeAdminTab === 'users') {
          const res = await apiFetch('/api/admin/users');
          if (res.success) {
            const users = res.data;
            let rowsHTML = '';
            users.forEach(u => {
              rowsHTML += `
                <tr>
                  <td>${u.username}</td>
                  <td>${u.email}</td>
                  <td style="text-transform: uppercase; font-weight: 600;">${u.role}</td>
                  <td>💎 ${u.credits}</td>
                  <td>${new Date(u.createdAt).toLocaleDateString()}</td>
                </tr>
              `;
            });

            document.getElementById('admin-content-box').innerHTML = `
              <div class="card">
                <h3 style="font-size: 18px; font-weight: 700; margin-bottom: 16px;">Registered Users List</h3>
                <div style="overflow-x: auto;">
                  <table class="admin-table">
                    <thead>
                      <tr>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Wallet Credits</th>
                        <th>Join Date</th>
                      </tr>
                    </thead>
                    <tbody>${rowsHTML || '<tr><td colspan="5" style="text-align: center;">No users registered.</td></tr>'}</tbody>
                  </table>
                </div>
              </div>
            `;
          }
        }
        else if (activeAdminTab === 'skills') {
          const res = await apiFetch('/api/admin/skills');
          if (res.success) {
            const skills = res.data;
            let rowsHTML = '';
            skills.forEach(s => {
              rowsHTML += `
                <tr>
                  <td>${s.title}</td>
                  <td>${s.category}</td>
                  <td>💎 ${s.credits}</td>
                  <td>${s.creator ? s.creator.username : 'N/A'}</td>
                  <td>⭐ ${s.averageRating} (${s.reviewsCount})</td>
                  <td>${new Date(s.createdAt).toLocaleDateString()}</td>
                </tr>
              `;
            });

            document.getElementById('admin-content-box').innerHTML = `
              <div class="card">
                <h3 style="font-size: 18px; font-weight: 700; margin-bottom: 16px;">Published Skill Listings</h3>
                <div style="overflow-x: auto;">
                  <table class="admin-table">
                    <thead>
                      <tr>
                        <th>Title</th>
                        <th>Category</th>
                        <th>Cost (Credits)</th>
                        <th>Instructor</th>
                        <th>Ratings (Reviews)</th>
                        <th>Created Date</th>
                      </tr>
                    </thead>
                    <tbody>${rowsHTML || '<tr><td colspan="6" style="text-align: center;">No skill listings published.</td></tr>'}</tbody>
                  </table>
                </div>
              </div>
            `;
          }
        }
        else if (activeAdminTab === 'bookings') {
          const res = await apiFetch('/api/admin/bookings');
          if (res.success) {
            const bookings = res.data;
            let rowsHTML = '';
            bookings.forEach(b => {
              rowsHTML += `
                <tr>
                  <td>${b.skill ? b.skill.title : 'N/A'}</td>
                  <td>${b.instructor ? b.instructor.username : 'N/A'}</td>
                  <td>${b.learner ? b.learner.username : 'N/A'}</td>
                  <td>${new Date(b.date).toLocaleDateString()} at ${b.timeSlot}</td>
                  <td>💎 ${b.credits}</td>
                  <td><span class="status-badge status-${b.status}">${b.status}</span></td>
                </tr>
              `;
            });

            document.getElementById('admin-content-box').innerHTML = `
              <div class="card">
                <h3 style="font-size: 18px; font-weight: 700; margin-bottom: 16px;">Booking Sessions History</h3>
                <div style="overflow-x: auto;">
                  <table class="admin-table">
                    <thead>
                      <tr>
                        <th>Skill Class</th>
                        <th>Instructor</th>
                        <th>Learner</th>
                        <th>Scheduled slot</th>
                        <th>Cost</th>
                        <th>Status</th>
                      </tr>
                    </thead>
                    <tbody>${rowsHTML || '<tr><td colspan="6" style="text-align: center;">No booking logs recorded.</td></tr>'}</tbody>
                  </table>
                </div>
              </div>
            `;
          }
        }
      } catch (err) {
        showToast('Admin API request failed.', 'error');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (verifyAdminAccess()) {
        loadAdminData();
      }
    });
  </script>
</body>
</html>
