<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - SkillSwap</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .dashboard-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 32px;
      margin-bottom: 48px;
    }
    @media (max-width: 992px) {
      .dashboard-grid {
        grid-template-columns: 1fr;
      }
    }
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 32px;
    }
    @media (max-width: 576px) {
      .metrics-grid {
        grid-template-columns: 1fr;
      }
    }
    .activity-item {
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }
    .activity-item:last-child {
      border-bottom: none;
    }
    .quick-link-card {
      text-align: center;
      padding: 20px;
      cursor: pointer;
      border: 1px solid var(--border);
      transition: var(--transition);
    }
    .quick-link-card:hover {
      border-color: var(--primary-blue);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <!-- Injected Header -->
  <div id="global-navbar"></div>

  <div class="page-header">
    <div class="container">
      <h1 class="page-title" id="welcome-msg">Dashboard</h1>
    </div>
  </div>

  <div class="container">
    <div class="dashboard-grid">
      <!-- Left side: Metrics, Upcoming sessions, recent activity -->
      <div>
        <!-- Metrics -->
        <div class="metrics-grid">
          <div class="card" style="border-left: 4px solid var(--primary-blue);">
            <div style="font-size: 14px; color: var(--secondary); font-weight: 500;">Wallet Credits</div>
            <div style="font-size: 28px; font-weight: 700; margin-top: 4px;" id="metric-credits">0</div>
          </div>
          <div class="card" style="border-left: 4px solid var(--emerald);">
            <div style="font-size: 14px; color: var(--secondary); font-weight: 500;">Sessions Taught</div>
            <div style="font-size: 28px; font-weight: 700; margin-top: 4px;" id="metric-taught">0</div>
          </div>
          <div class="card" style="border-left: 4px solid var(--yellow);">
            <div style="font-size: 14px; color: var(--secondary); font-weight: 500;">Sessions Learned</div>
            <div style="font-size: 28px; font-weight: 700; margin-top: 4px;" id="metric-learned">0</div>
          </div>
        </div>

        <!-- Upcoming sessions -->
        <div class="card" style="margin-bottom: 32px;" id="upcoming-card">
          <h3 style="font-size: 18px; font-weight: 700; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;">
            Upcoming Sessions
            <a href="/my-sessions.html" style="font-size: 13px; font-weight: 500;">View All</a>
          </h3>
          <div id="upcoming-list">
            <!-- Dynamic upcoming list -->
          </div>
        </div>

        <!-- Recent Activity Feed -->
        <div class="card" id="activity-card">
          <h3 style="font-size: 18px; font-weight: 700; margin-bottom: 20px;">Recent Activity</h3>
          <div id="activity-list">
            <!-- Dynamic activity -->
          </div>
        </div>
      </div>

      <!-- Right side: Quick links & create skill -->
      <div>
        <div class="card" style="margin-bottom: 32px;">
          <h3 style="font-size: 18px; font-weight: 700; margin-bottom: 20px;">Quick Actions</h3>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
            <div class="quick-link-card card" onclick="showCreateSkillModal()">
              <p style="font-size: 24px; margin-bottom: 8px;">➕</p>
              <h4 style="font-size: 13px; font-weight: 600;">List a Skill</h4>
            </div>
            <div class="quick-link-card card" onclick="window.location.href='/browse-skills.html'">
              <p style="font-size: 24px; margin-bottom: 8px;">🔍</p>
              <h4 style="font-size: 13px; font-weight: 600;">Browse Skills</h4>
            </div>
            <div class="quick-link-card card" onclick="window.location.href='/wallet.html'">
              <p style="font-size: 24px; margin-bottom: 8px;">💳</p>
              <h4 style="font-size: 13px; font-weight: 600;">Wallet Logs</h4>
            </div>
            <div class="quick-link-card card" onclick="window.location.href='/edit-profile.html'">
              <p style="font-size: 24px; margin-bottom: 8px;">✏️</p>
              <h4 style="font-size: 13px; font-weight: 600;">Edit Profile</h4>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Create Skill Listing Modal -->
  <div class="modal-overlay" id="create-skill-modal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">List a Skill</h3>
        <button class="modal-close" onclick="hideCreateSkillModal()">&times;</button>
      </div>
      <form id="create-skill-form" onsubmit="handleCreateSkill(event)">
        <div class="form-group">
          <label class="form-label" for="skill-title">Skill Title</label>
          <input class="form-control" type="text" id="skill-title" required placeholder="e.g. Intro to Node.js & REST APIs" maxlength="100">
        </div>
        <div class="form-group">
          <label class="form-label" for="skill-category">Category</label>
          <select class="form-control" id="skill-category" required>
            <option value="">Select a Category</option>
            <option value="Technology">Technology</option>
            <option value="Language">Language</option>
            <option value="Design">Design</option>
            <option value="Music">Music</option>
            <option value="Marketing">Marketing</option>
            <option value="Business">Business</option>
            <option value="Academics">Academics</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label class="form-label" for="skill-credits">Credit Cost (Per Hour)</label>
            <input class="form-control" type="number" id="skill-credits" required min="1" placeholder="e.g. 2">
          </div>
          <div class="form-group">
            <label class="form-label" for="skill-duration">Duration (Minutes)</label>
            <input class="form-control" type="number" id="skill-duration" required min="15" value="60">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="skill-description">Description</label>
          <textarea class="form-control" id="skill-description" rows="4" required placeholder="Detail what you will cover, requirements, and teaching style..." maxlength="1000"></textarea>
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px;">
          <button type="button" class="btn btn-secondary" onclick="hideCreateSkillModal()">Cancel</button>
          <button type="submit" class="btn btn-primary" id="create-btn">Publish Skill</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Injected Footer -->
  <div id="global-footer"></div>

  <script src="/js/main.js"></script>
  <script>
    // Fetch Dashboard statistics and dynamic bookings logs
    async function loadDashboard() {
      showLoader('upcoming-list');
      showLoader('activity-list');
      
      try {
        const res = await apiFetch('/api/users/dashboard');
        
        if (res.success) {
          const { credits, upcomingSessions, progress, recentActivity } = res.data;

          // Update metrics counters
          document.getElementById('metric-credits').innerText = credits;
          document.getElementById('metric-taught').innerText = progress.taught;
          document.getElementById('metric-learned').innerText = progress.learned;

          // Populate Welcome header
          const userStr = localStorage.getItem('user');
          if (userStr) {
            const user = JSON.parse(userStr);
            document.getElementById('welcome-msg').innerText = `Welcome Back, ${user.username}!`;
          }

          // Populate Upcoming bookings list
          if (upcomingSessions.length === 0) {
            document.getElementById('upcoming-list').innerHTML = `
              <p style="color: var(--secondary); text-align: center; padding: 20px; font-size: 14px;">
                No upcoming sessions scheduled. <a href="/browse-skills.html">Browse skills</a> to book one!
              </p>
            `;
          } else {
            let upcomingHTML = '';
            const cachedUser = JSON.parse(localStorage.getItem('user') || '{}');
            
            upcomingSessions.forEach(booking => {
              const isInstructor = booking.instructor._id === cachedUser._id;
              const counterparty = isInstructor ? booking.learner : booking.instructor;
              const roleTag = isInstructor ? 'Teaching' : 'Learning';
              
              upcomingHTML += `
                <div class="activity-item flex-between" style="padding: 16px 0;">
                  <div class="flex-align">
                    <img src="${counterparty.profile.avatar || '/uploads/default-avatar.png'}" class="instructor-avatar">
                    <div>
                      <h4 style="font-weight: 600; font-size: 15px;">${booking.skill.title}</h4>
                      <p style="color: var(--secondary); font-size: 13px;">
                        ${roleTag} with <strong>${counterparty.username}</strong> | ${new Date(booking.date).toLocaleDateString()} at ${booking.timeSlot}
                      </p>
                    </div>
                  </div>
                  <div style="display: flex; gap: 8px;">
                    <a href="/my-sessions.html" class="btn btn-secondary btn-sm" style="padding: 4px 10px;">Manage</a>
                  </div>
                </div>
              `;
            });
            document.getElementById('upcoming-list').innerHTML = upcomingHTML;
          }

          // Populate Recent Activity Feed
          if (recentActivity.length === 0) {
            document.getElementById('activity-list').innerHTML = `
              <p style="color: var(--secondary); text-align: center; padding: 20px; font-size: 14px;">No recent activity logged.</p>
            `;
          } else {
            let activityHTML = '';
            recentActivity.forEach(act => {
              const actionTime = new Date(act.createdAt).toLocaleDateString();
              let text = '';
              if (act.status === 'upcoming') {
                text = `<strong>${act.learner.username}</strong> booked <strong>${act.skill.title}</strong> taught by <strong>${act.instructor.username}</strong>.`;
              } else if (act.status === 'completed') {
                text = `Session for <strong>${act.skill.title}</strong> was marked completed. Credits transferred.`;
              } else {
                text = `Session for <strong>${act.skill.title}</strong> was cancelled. Credits refunded.`;
              }
              
              activityHTML += `
                <div class="activity-item">
                  <span style="color: var(--secondary); font-size: 12px; display: block; margin-bottom: 2px;">${actionTime}</span>
                  <p>${text}</p>
                </div>
              `;
            });
            document.getElementById('activity-list').innerHTML = activityHTML;
          }
        }
      } catch (err) {
        showToast(err.message || 'Error loading dashboard metrics', 'error');
      }
    }

    // Modal creation toggles
    function showCreateSkillModal() {
      document.getElementById('create-skill-modal').classList.add('active');
    }
    
    function hideCreateSkillModal() {
      document.getElementById('create-skill-modal').classList.remove('active');
      document.getElementById('create-skill-form').reset();
    }

    // Create skill form handler
    async function handleCreateSkill(e) {
      e.preventDefault();
      
      const createBtn = document.getElementById('create-btn');
      createBtn.disabled = true;
      createBtn.innerText = 'Publishing...';

      const title = document.getElementById('skill-title').value;
      const category = document.getElementById('skill-category').value;
      const credits = document.getElementById('skill-credits').value;
      const duration = document.getElementById('skill-duration').value;
      const description = document.getElementById('skill-description').value;

      try {
        const res = await apiFetch('/api/skills', {
          method: 'POST',
          body: { title, category, credits, duration, description }
        });

        if (res.success) {
          showToast('Skill published successfully!', 'success');
          hideCreateSkillModal();
          // Reload dashboard metrics to reflect recent activity changes
          loadDashboard();
        }
      } catch (err) {
        showToast(err.message || 'Failed to list skill', 'error');
      } finally {
        createBtn.disabled = false;
        createBtn.innerText = 'Publish Skill';
      }
    }

    document.addEventListener('DOMContentLoaded', loadDashboard);
  </script>
</body>
</html>
