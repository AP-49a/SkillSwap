<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - SkillSwap</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .contact-layout {
      max-width: 600px;
      margin: 0 auto 48px;
    }
  </style>
</head>
<body>

  <!-- Injected Header -->
  <div id="global-navbar"></div>

  <div class="page-header">
    <div class="container">
      <h1 class="page-title">Contact Support</h1>
    </div>
  </div>

  <div class="container">
    <div class="contact-layout card">
      <h2 style="font-size: 20px; font-weight: 700; margin-bottom: 8px;">Get in Touch</h2>
      <p style="color: var(--secondary); font-size: 14px; margin-bottom: 24px;">Need help with booking, credits, or account issues? Send us a message.</p>

      <form onsubmit="handleContact(event)">
        <div class="form-group">
          <label class="form-label" for="contact-name">Full Name</label>
          <input class="form-control" type="text" id="contact-name" required placeholder="John Doe">
        </div>
        <div class="form-group">
          <label class="form-label" for="contact-email">Email Address</label>
          <input class="form-control" type="email" id="contact-email" required placeholder="john@domain.com">
        </div>
        <div class="form-group">
          <label class="form-label" for="contact-msg">Message</label>
          <textarea class="form-control" id="contact-msg" rows="5" required placeholder="Explain your issue or question in detail..."></textarea>
        </div>
        <button class="btn btn-primary" type="submit" style="width: 100%; margin-top: 12px;">Send Message</button>
      </form>
    </div>
  </div>

  <!-- Injected Footer -->
  <div id="global-footer"></div>

  <script src="/js/main.js"></script>
  <script>
    function handleContact(e) {
      e.preventDefault();
      showToast('Support ticket submitted successfully! We will get back to you shortly.', 'success');
      e.target.reset();
    }
  </script>
</body>
</html>
