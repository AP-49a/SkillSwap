<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found - SkillSwap</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .error-layout {
      text-align: center;
      padding: 100px 24px;
      max-width: 500px;
      margin: 0 auto;
    }
  </style>
</head>
<body>

  <!-- Injected Header -->
  <div id="global-navbar"></div>

  <div class="container">
    <div class="error-layout">
      <h1 style="font-size: 96px; font-weight: 800; color: var(--primary-blue); line-height: 1; margin-bottom: 24px;">404</h1>
      <h2 style="font-size: 24px; font-weight: 700; margin-bottom: 12px;">Oops! Page Not Found</h2>
      <p style="color: var(--secondary); font-size: 16px; margin-bottom: 32px;">
        The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
      </p>
      <a href="/" class="btn btn-primary">Return to Homepage</a>
    </div>
  </div>

  <!-- Injected Footer -->
  <div id="global-footer"></div>

  <script src="/js/main.js"></script>
</body>
</html>
